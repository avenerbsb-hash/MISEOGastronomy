name: testes

on:
  push:
  pull_request:

jobs:
  banco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi

      - name: Rodar testes/rodar.sh
        run: |
          set -o pipefail
          sudo bash testes/rodar.sh 2>&1 | tee saida.txt
          for m in "TODOS OS TESTES PASSARAM" "CMV DE REFERÊNCIA OK" "CORREÇÕES 0005 OK" "CORREÇÕES 0006 OK" "SEED OK" "CATEGORIAS OK" "RECEBIMENTO OK" "VARIAÇÃO FICHAS OK" "ALERTAS OK" "IMPACTO OK" "FORNECEDORES OK" "PAINEL CMV OK" "INTELIGÊNCIA DE PREÇOS OK" "ESTRUTURA DE CUSTOS OK" "ACUMULADO ANUAL OK" "ESTORNO OK" "CUSTO X MEDIA OK"; do
            grep -q "$m" saida.txt || { echo "Faltou: $m"; exit 1; }
          done

      - name: Resumo
        if: always()
        run: |
          { echo '```'; tail -n 100 saida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
